name: Release to NPM and PyPI
# Builds and releases the application to NPM and PyPI 
# when a new release is published or the workflow is manually triggered.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  REGISTRY_URL: 'https://registry.npmjs.org'

jobs:
  release_to_npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: ${{ env.REGISTRY_URL }}
    
    - name: Install Node dependencies    
      run: npm install

    - name: Build React application
      run: |-
        node -v
        npm -v
        make build

    # Renaming README.npm.md to README.md just for npm
    - name: Use NPM specific README
      run: mv README.npm.md README.md

    # Authenticates via OIDC trusted publishing. The version is staged and
    # must be approved by a maintainer on npmjs.com before it goes live.
    - name: Stage publish to npm
      run: npm stage publish

  release_to_pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tests
        uses: "./.github/actions/setup_tests"

      - name: Install wheel
        run: pip install wheel

      - name: Make Python package
        run: make package

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package/dist
          password: ${{ secrets.KEDRO_VIZ_PYPI_TOKEN }}        
