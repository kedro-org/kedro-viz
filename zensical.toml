# Zensical configuration for the Kedro-Viz documentation.

[project]
site_name = "Kedro-Viz"
site_url = "https://docs.kedro.org/projects/kedro-viz/en/stable/"
site_description = "Kedro-Viz is an interactive development tool for visualising data science pipelines built with Kedro."
site_dir = "site"
docs_dir = "docs"
use_directory_urls = true

repo_name = "kedro-org/kedro-viz"
repo_url = "https://github.com/kedro-org/kedro-viz"

extra_css = [
  "stylesheets/colors.css",
  "stylesheets/globals.css",
  "stylesheets/typography.css",
  "stylesheets/themes.css",
  "stylesheets/footer.css",
  "stylesheets/welcome.css"
]

extra_javascript = [
  "https://kedro.org/consent/kedro-consent.js",
  "javascript/readthedocs.js",
  "javascript/deindex-old-docs.js"
]

nav = [
  {"Welcome" = "https://docs.kedro.org/en/stable/"},
  {"Kedro" = "https://docs.kedro.org/en/stable/getting-started/course/"},
  {"Kedro-Viz" = [
    {"Overview" = "index.md"},
    {"Learn about Kedro-Viz" = [
      {"How to visualise a Kedro project" = "kedro-viz_visualisation.md"},
      {"Sharing Kedro-Viz" = [
        {"Publish and share Kedro-Viz" = "share_kedro_viz.md"},
        {"Platform-agnostic sharing with Kedro-Viz" = "platform_agnostic_sharing_with_kedro_viz.md"},
        {"Publish and share on AWS" = "publish_and_share_kedro_viz_on_aws.md"},
        {"Publish and share on Azure" = "publish_and_share_kedro_viz_on_azure.md"},
        {"Publish and share on GCP" = "publish_and_share_kedro_viz_on_gcp.md"}
      ]},
      {"Previews in Kedro-Viz" = [
        {"Preview datasets overview" = "preview_datasets.md"},
        {"Preview Matplotlib charts in Kedro-Viz" = "preview_matplotlib_datasets.md"},
        {"Preview Plotly charts in Kedro-Viz" = "preview_plotly_datasets.md"},
        {"Preview tabular data in Kedro-Viz" = "preview_pandas_datasets.md"},
        {"Preview nodes in Kedro-Viz" = "preview_nodes.md"},
        {"Extend preview to custom datasets" = "preview_custom_datasets.md"}
      ]},
      {"Customise node styling in Kedro-Viz" = "customise_node_styling.md"},
      {"Slice a pipeline" = "slice_a_pipeline.md"},
      {"Migration from Kedro-Viz native experiment tracking to kedro-mlflow" = "migrate_experiment_tracking.md"},
      {"Visualise pipeline execution with the Workflow view" = "workflow-view.md"}
    ]},
    {"Other Documentation" = [
      {"Kedro-Viz CLI reference" = "cli-docs.md"}
    ]}
  ]},
  {"Kedro-Datasets" = "https://docs.kedro.org/projects/kedro-datasets/en/stable/"}
]

# -------------------------
# theme
# -------------------------
[project.theme]
language = "en"
custom_dir = "docs/overrides"
variant = "classic"
favicon = "https://kedro.org/images/favicon.ico"
logo = "assets/kedro_logo_black.svg"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.tracking",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
  "content.code.annotation",
  "content.code.copy",
  "content.code.annotate",
  "content.code.highlight"
]

[project.theme.font]
text = "Inter"
code = "Inter Regular"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "octicons/note-16"
tip = "octicons/info-16"
warning = "octicons/alert-16"
example = "octicons/code-16"

[[project.theme.palette]]
scheme = "light"
toggle.icon = "material/white-balance-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "dark"
toggle.icon = "material/white-balance-sunny"
toggle.name = "Switch to light mode"

# -------------------------
# markdown_extensions
# -------------------------
[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.tables]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = true
title = "Contents"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.superfences]

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

# -------------------------
# plugins
# -------------------------
[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.kedro.org/en/stable/objects.inv",
  "https://docs.kedro.org/projects/kedro-datasets/en/stable/objects.inv"
]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_toc_entry = true
show_source = false
docstring_style = "google"
merge_init_into_class = true
docstring_section_style = "list"
separate_signature = true
show_root_heading = true

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true
warn_unknown_params = false
returns_named_value = false

# -------------------------
# Unsupported in Zensical (as of 0.0.60), handled elsewhere or dropped:
#   - mkdocs-mermaid2-plugin: mermaid renders natively via the classic theme /
#     the superfences custom fence above, so the plugin is not needed.
#   - llms.txt / llms-full.txt generation: not supported (tracked in
#     zensical/backlog#83); no longer generated.
#   - validation (omitted_files / absolute_links / unrecognized_links / anchors):
#     not yet supported. Internal link breakage is not caught at build time;
#     external links are still checked by the linkcheck CI job (lychee).
#   - not_in_nav: not supported; pages outside the nav (e.g. readme.md) are
#     simply built.
# -------------------------
